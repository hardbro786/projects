---
# MYSQL SLAVE SERVER SETUP

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install MySQL and dependencies
  apt:
    name:
      - mysql-server
      - python3-pymysql
    state: present

- name: Ensure MySQL is running
  service:
    name: mysql
    state: started
    enabled: yes

- name: Wait for MySQL to be ready
  wait_for:
    port: 3306
    delay: 10
    timeout: 30

- name: Stop MySQL
  service:
    name: mysql
    state: stopped

- name: Configure MySQL Slave
  blockinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    block: |
      [mysqld]
      server-id = 2
      relay-log = /var/log/mysql/mysql-relay-bin.log
      read_only = 1
      bind-address = 0.0.0.0
      binlog_format = ROW

- name: Start MySQL
  service:
    name: mysql
    state: started

- name: Wait for restart
  wait_for:
    port: 3306
    delay: 5
    timeout: 30

# GET MASTER REPLICATION INFO
- name: Set master info
  set_fact:
    master_log_file: "{{ hostvars[groups['Role_Master'][0]].master_log_file }}"
    master_log_pos: "{{ hostvars[groups['Role_Master'][0]].master_log_pos }}"

- name: Reset slave
  shell: |
    mysql -u root -p{{ mysql_root_password }} -e "STOP SLAVE; RESET SLAVE ALL;"
  args:
    executable: /bin/bash

- name: Configure replication
  shell: |
    mysql -u root -p{{ mysql_root_password }} -e "
    CHANGE MASTER TO
    MASTER_HOST='{{ groups['Role_Master'][0] }}',
    MASTER_USER='{{ replication_user }}',
    MASTER_PASSWORD='{{ replication_password }}',
    MASTER_LOG_FILE='{{ master_log_file }}',
    MASTER_LOG_POS={{ master_log_pos }};
    "
  args:
    executable: /bin/bash

- name: Start slave
  shell: mysql -u root -p{{ mysql_root_password }} -e "START SLAVE;"
  args:
    executable: /bin/bash
